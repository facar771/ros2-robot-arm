# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# NOTE: previously this file contained the top-level key `joint_limits:` twice (duplicate YAML key, first block was
# silently discarded). Merged into one block: velocity limits + acceleration limits enabled.

# Fraction of max velocity/acceleration used when a request does not set its own scaling.
# (0.1 made every motion very slow; clients such as cli_moveit now also set scaling explicitly.)
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_2:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_3:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_4:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_5:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_6:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
