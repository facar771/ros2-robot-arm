# Quality tags of the KARMA robot's physical values (A2: Ferhat's KUCUK_ROBOT). Format and rules:
# see ../quality.profile.yaml (six-axis robot) and docs/ROBOT_PROFILE.md. Read by robot_core.maturity
# ONLY; it changes no generated file.
#
# No PHYSICAL VALUE below is `measured`: the printed robot was never measured, weighed or calibrated.
#   estimated   = a design number: link lengths / joint positions from the SolidWorks CAD (STL bore
#                 centres), joint ranges Ferhat stated (180 deg), motor types and reductions he
#                 stated (4:1, 16:1), the 28BYJ-48 datasheet step count. NOT verified on the robot.
#   placeholder = a stand-in: masses (solid-PLA volume + motors), efforts, J1 +-170 deg, every
#                 servo pulse range / slew limit / rest pose, microsteps, the (not yet built) switch
#                 positions, the whole gripper actuator.
#   measured    = only `driver.model` of joint_1 / joint_2 (ULN2003): verified by Ferhat on the bench
#                 build (A2b). An informational tag: it opens no gate and closes no gap.
# A mesh or a CAD number never makes a field `measured` (only a measurement on the robot does).
# Hardware readiness stays closed (it needs every critical field `measured` + the torque check).
quality_version: 1
robot: karma_robot
fields:
  links.base_link.length: estimated
  links.base_link.mass: placeholder
  links.link_1.length: estimated
  links.link_1.mass: placeholder
