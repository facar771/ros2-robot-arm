# Quality tags of the KARMA robot's physical values (K8). Format and rules: see
# ../quality.profile.yaml (six-axis robot) and docs/ROBOT_PROFILE.md. Read by robot_core.maturity
# ONLY; it changes no generated file.
#
# NOTHING below is `measured`: the robot is not built and no value was ever measured.
#   placeholder = a stand-in (all masses, all efforts, ALL hardware/axes data incl. pulse ranges,
#                 slew limits, rest/reference poses, the switch positions of the step axes)
#   estimated   = design number of the not-yet-built robot (link lengths, joint position limits);
#                 NOT verified on any real part. Uncertain -> `estimated`, never `measured`.
# Hardware readiness stays closed (it needs every critical field `measured` + the torque check;
# the 28BYJ-48 shoulder and the SG90 pairs are expected to fail that check).
quality_version: 1
robot: karma_robot
fields:
  links.base_link.length: estimated
  links.base_link.mass: placeholder
  links.link_1.length: estimated
  links.link_1.mass: placeholder
