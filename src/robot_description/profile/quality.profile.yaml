# Quality tags of the physical values (design: docs/ROBOT_PROFILE.md, "Eksik bilgiyle çalışan profil").
# Read by robot_core.maturity ONLY; it never enters the URDF, the MoveIt files or the firmware header,
# so editing it changes no generated file.
#
#   <field path>: measured | estimated | placeholder | null
#   <field path>: {tag: measured, value: 0.35}     # pins the value: if the profile number changes
#                                                  # later the tag is 'stale' and does NOT count
#
# A field that is not listed is `placeholder` (the narrow choice). `null` = no value known at all.
# Hardware readiness needs every critical field `measured` AND the static torque check passed:
#   links.<link>.length / .mass          joints.<joint>.limits.position / .effort
#   axes.<joint>.motor.type / .motor.steps_per_rev / .driver.microstep / .gear_ratio
#   axes.<joint>.limits.position / .homing.position           (hobby_servo: axes.<joint>.servo.pulse_range)
#
# NOTHING below is `measured`: this is a simulated robot, no value was ever measured. Today's tags
# (explicit, so a reader sees them without knowing the default):
#   placeholder = the YAML itself calls it a stand-in (all masses, all hardware/axes data, effort 100)
#   estimated   = design number of the simulated robot (link lengths, joint position limits); NOT
#                 verified on any real part. Uncertain -> `estimated`, never `measured`.
# Ferhat decides which of these were really measured; until then hardware readiness stays closed.
# (`servo.pulse_range` is not listed: hobby_servo axes arrive with K6.)
quality_version: 1
robot: six_axis_robot
fields:
  links.base_link.length: estimated
  links.base_link.mass: placeholder
  links.link_1.length: estimated
  links.link_1.mass: placeholder
