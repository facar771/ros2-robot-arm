name: N8 diag (temporary, removed before merge)
on:
  push:
    branches: [n8-gazebo-selftest-flake]
jobs:
  diag:
    name: gazebo-jobs diag ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: ros2-robot-arm:ci
          cache-from: type=gha
      - name: gazebo-jobs x3 and gazebo-integration x3
        run: |
          for mode in gazebo-jobs gazebo-integration; do
            for i in 1 2 3; do
              docker run --rm -v "$PWD/apps/control_hub:/workspace/apps/control_hub:ro" \
                -v "$PWD/plugins:/workspace/plugins:ro" ros2-robot-arm:ci run_selftest $mode > /tmp/$mode-$i.log 2>&1
              rc=$?
              echo "--- $mode koşu $i: rc=$rc $(grep -a '=== .* test geçti' /tmp/$mode-$i.log | tail -1)"
              grep -a 'ÖLÇÜM\|\[FAIL\]' /tmp/$mode-$i.log | sed 's/^[0-9T:.Z-]* //' | sort -u
            done
          done
