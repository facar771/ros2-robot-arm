name: N8 diag (temporary, removed before merge)
on:
  push:
    branches: [n8-gazebo-selftest-flake]
jobs:
  diag:
    name: gazebo-jobs diag ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: ros2-robot-arm:ci
          cache-from: type=gha
      - name: gazebo-integration x3 (keep logs of failures)
        run: |
          mode=gazebo-integration
          for i in 1 2 3; do
            rc=0
            docker run --rm -v "$PWD/apps/control_hub:/workspace/apps/control_hub:ro" \
              -v "$PWD/plugins:/workspace/plugins:ro" ros2-robot-arm:ci run_selftest $mode > /tmp/$mode-$i.log 2>&1 || rc=$?
            echo "--- $mode koşu $i: rc=$rc $(grep -a '=== .* test geçti' /tmp/$mode-$i.log | tail -1)"
            if [ $rc -ne 0 ]; then
              grep -a '\[FAIL\]\|scenario_finished\|step_finished' /tmp/$mode-$i.log | sed 's/^[0-9T:.Z-]* //' | sort -u | cut -c1-300
              echo "##### TAM GÜNLÜK (başarısız koşu) #####"
              cut -c1-400 /tmp/$mode-$i.log
              echo "##### GÜNLÜK SONU #####"
            fi
          done
          true
