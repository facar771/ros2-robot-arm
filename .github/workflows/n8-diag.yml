name: N8 diag (temporary, removed before merge)
on:
  push:
    branches: [n8-gazebo-selftest-flake]
jobs:
  diag:
    name: gazebo-cmd diag ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: ros2-robot-arm:ci
          cache-from: type=gha
      - name: gazebo-cmd x5
        run: |
          for i in 1 2 3 4 5; do
            rc=0
            docker run --rm ros2-robot-arm:ci run_selftest gazebo-cmd > /tmp/c$i.log 2>&1 || rc=$?
            echo "--- gazebo-cmd koşu $i: rc=$rc $(grep -a '=== .* test geçti' /tmp/c$i.log | tail -1)"
            if [ $rc -ne 0 ]; then
              grep -a '\[FAIL\]\|durum [0-9]*, mesaj\|hata inf\|plan [0-9]:' /tmp/c$i.log | sort -u | cut -c1-900
            fi
          done
          true
