name: N8 diag (temporary, removed before merge)
on:
  push:
    branches: [n8-gazebo-selftest-flake]
jobs:
  diag:
    name: gazebo-jobs diag ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: ros2-robot-arm:ci
          cache-from: type=gha
      - name: gazebo-jobs x3, keep ÖLÇÜM lines
        run: |
          for i in 1 2 3; do
            docker run --rm ros2-robot-arm:ci run_selftest gazebo-jobs > /tmp/j$i.log 2>&1 || true
            echo "--- koşu $i: $(grep -a '=== .* test geçti' /tmp/j$i.log | tail -1)"
            grep -a 'ÖLÇÜM\|ORTASINDA' /tmp/j$i.log | sed 's/^[0-9T:.Z-]* //'
          done
