name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Lint + unit tests (no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest ruff pyyaml numpy python-fcl "sqlalchemy>=2.0" alembic
      - run: ruff check src
      - run: python -m pytest

  data:
    name: Data layer on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: robot
          POSTGRES_PASSWORD: robot
          POSTGRES_DB: robot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robot -d robot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml numpy "sqlalchemy>=2.0" alembic "psycopg[binary]>=3.1"
      - name: robot_data tests (SQLite + PostgreSQL)
        run: python -m pytest src/robot_data/tests
        env:
          ROBOT_TEST_PG_URL: postgresql+psycopg://robot:robot@localhost:5432/robot

  hub:
    name: Control Hub (lint, tests, Docker smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/control_hub/requirements-dev.txt
      - run: ruff check apps/control_hub
      - name: pytest
        run: python -m pytest
        working-directory: apps/control_hub
      - name: Config files validate
        run: python -m control_hub --fake --check-config
        working-directory: apps/control_hub
      - name: Docker image starts, /health answers, API is behind the PIN
        run: |
          docker build -t control-hub apps/control_hub
          docker run -d --name hub -p 8765:8765 -e HUB_PIN=123456 control-hub
          for i in $(seq 1 30); do curl -fs localhost:8765/health && break; sleep 1; done
          curl -fs localhost:8765/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/api/state)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/)" = "200"
          docker rm -f hub

  ros:
    name: Build workspace + headless selftest, mock and Gazebo (Docker)
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (colcon build happens inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: ros2-robot-arm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Selftest - mock hardware
        run: docker run --rm ros2-robot-arm:ci run_selftest mock
      - name: Selftest - Gazebo physics (headless)
        run: docker run --rm ros2-robot-arm:ci run_selftest gazebo
      - name: Selftest - Gazebo + RGB-D camera (software rendering)
        run: docker run --rm ros2-robot-arm:ci run_selftest gazebo-camera
      - name: Selftest - perception (detected object positions vs. world file)
        run: docker run --rm ros2-robot-arm:ci run_selftest gazebo-perception
      - name: Selftest - perception -> planning scene (collision objects from detections)
        run: docker run --rm ros2-robot-arm:ci run_selftest gazebo-scene
      - name: Selftest - Cartesian goals and Skills (go_above, explicit errors)
        run: docker run --rm ros2-robot-arm:ci run_selftest gazebo-skills
      - name: Selftest - read-only browser view (page, JSON, PNGs and overlay vs. world file)
        run: docker run --rm ros2-robot-arm:ci run_selftest gazebo-viz
      - name: Selftest - browser commands (white list, refusals, demo scenario measured from TF)
        run: docker run --rm ros2-robot-arm:ci run_selftest gazebo-cmd
      - name: Data layer - selftest events end up in SQLite
        run: >-
          docker run --rm -e ROBOT_DB_URL=sqlite:////tmp/robot.db ros2-robot-arm:ci
          bash -c '. /workspace/install/setup.bash && run_selftest mock
          && python3 -m robot_data summary --min-events 6'
