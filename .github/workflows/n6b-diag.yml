name: N6b diag (temporary, removed before merge)
on:
  push:
    branches: [n6b-watchdog-ayrim]
jobs:
  diag:
    name: hw diag ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: ros2-robot-arm:ci
          cache-from: type=gha
      - name: hw x5
        run: |
          for i in 1 2 3 4 5; do
            rc=0
            docker run --rm ros2-robot-arm:ci run_selftest hw > /tmp/hw$i.log 2>&1 || rc=$?
            echo "--- hw koşu $i: rc=$rc $(grep -a '=== .* test geçti' /tmp/hw$i.log | tail -1)"
            grep -a 'ÖLÇÜM\|\[FAIL\]' /tmp/hw$i.log | sort -u | cut -c1-500
          done
          true
