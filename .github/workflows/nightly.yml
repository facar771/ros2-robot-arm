name: Nightly selftests

# Every selftest, 3 times each, on the default branch. A flaky check (passes sometimes, fails
# sometimes) shows up here as KARARSIZ instead of as a random red PR. The unpinned parts of the image
# (apt packages: ROS, MoveIt, Gazebo) are what this notices when they drift.
# Scheduled workflows only run for the default branch, so this starts working once it is merged.
on:
  schedule:
    - cron: '23 1 * * *'        # 01:23 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: 'runs per mode'
        default: '3'

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  selftests:
    name: ${{ matrix.mode }} x runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode:
          - mock
          - gazebo
          - gazebo-camera
          - gazebo-perception
          - gazebo-scene
          - gazebo-skills
          - gazebo-viz
          - gazebo-cmd
          - gazebo-stop
          - gazebo-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (shares the cache with CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: ros2-robot-arm:ci
          cache-from: type=gha
      - name: ${{ matrix.mode }}, repeated
        run: docker/repeat_selftest.sh ros2-robot-arm:ci ${{ matrix.mode }} ${{ inputs.runs || 3 }}
