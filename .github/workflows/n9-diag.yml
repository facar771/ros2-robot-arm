name: N9 diag (temporary, removed before merge)
on:
  push:
    branches: [n9-plans-6]
jobs:
  diag:
    name: n9 diag ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: ros2-robot-arm:ci
          cache-from: type=gha
      - name: gazebo-integration x8 and gazebo-cmd x5 (N9 effect)
        run: |
          for spec in "gazebo-integration 8" "gazebo-cmd 5"; do
            set -- $spec; mode=$1; reps=$2
            for i in $(seq 1 $reps); do
              rc=0
              docker run --rm -v "$PWD/apps/control_hub:/workspace/apps/control_hub:ro" \
                -v "$PWD/plugins:/workspace/plugins:ro" ros2-robot-arm:ci run_selftest $mode > /tmp/$mode-$i.log 2>&1 || rc=$?
              echo "--- $mode koşu $i: rc=$rc $(grep -a '=== .* test geçti' /tmp/$mode-$i.log | tail -1)"
              if [ $rc -ne 0 ]; then
                grep -a '\[FAIL\]\|durum [0-9]*, mesaj\|planın hepsi\|plan [0-9]:' /tmp/$mode-$i.log | sort -u | cut -c1-900
              fi
            done
          done
          true
