# docker compose up -d db             -> PostgreSQL for runs/events/error reports (localhost:5432)
# docker compose run --rm dev        -> interactive shell with RViz support (WSLg), repo mounted
# docker compose run --rm selftest          -> headless end-to-end test, mock hardware (same as CI)
# docker compose run --rm selftest-gazebo   -> same test on Gazebo physics (same as CI)
# docker compose run --rm selftest-camera   -> Gazebo + RGB-D camera: motion test + sensor_check
# docker compose run --rm selftest-perception -> Gazebo + camera + detector: perception_check
# docker compose run --rm selftest-scene     -> + detections in the MoveIt scene: perception_scene_check
# docker compose run --rm selftest-skills    -> Skills layer: go_above etc., tool position measured from TF
# docker compose run --rm selftest-db        -> selftest with its events written to PostgreSQL
# docker compose run --rm selftest-viz       -> + read-only browser view: viz_check (page, PNGs, overlay, JSON)
# docker compose up demo                     -> interactive demo, browser view at http://localhost:8080
#                                               (second terminal: ./docker/cli.sh)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot
      POSTGRES_DB: robot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d robot"]
      interval: 3s
      timeout: 3s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: ros2-robot-arm:dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - QT_QPA_PLATFORM=xcb
      - ROBOT_ROUTES=/workspace/data/routes.json
      - ROBOT_DB_URL=postgresql://robot:robot@localhost:5432/robot
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    depends_on:
      db:
        condition: service_healthy

  selftest:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci

  selftest-gazebo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci
    command: ["run_selftest", "gazebo"]

  selftest-camera:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci
    command: ["run_selftest", "gazebo-camera"]

  selftest-perception:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci
    command: ["run_selftest", "gazebo-perception"]

  selftest-scene:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci
    command: ["run_selftest", "gazebo-scene"]

  selftest-skills:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci
    command: ["run_selftest", "gazebo-skills"]

  selftest-viz:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci
    command: ["run_selftest", "gazebo-viz"]

  # Interactive demo: headless simulation + read-only browser view. No host networking: the only
  # thing reachable from the host is the web view, and only on the host's own 127.0.0.1.
  demo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci
    init: true                 # signals reach run_demo; no zombie processes
    stop_grace_period: 30s     # Gazebo needs a few seconds to shut down
    ports:
      - "127.0.0.1:${VIEW_PORT:-8080}:8080"
    command: ["run_demo"]

  selftest-db:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ci
    image: ros2-robot-arm:ci
    environment:
      - ROBOT_DB_URL=postgresql://robot:robot@db:5432/robot
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "-c", ". /workspace/install/setup.bash && run_selftest mock && python3 -m robot_data summary --min-events 6"]

volumes:
  pgdata:
