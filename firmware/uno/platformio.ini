; K9 Uno firmware. env:uno = Faz 1 (HAREKETSİZ).  env:uno_bench = Faz 2a TEZGÂH (3 step, K9_BENCH=1).
; Derleme: pio run -e uno  |  pio run -e uno_bench   Yükleme: pio run -e uno_bench -t upload --upload-port COM3
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
; Seri tamponlar: 115200'de 64 B ~5,5 ms dolar; Faz 2'de adım üretimi sırasında bayt kaybolmasın diye 128 B.
; (Her biri +64 B RAM; bütçe: firmware/FAZ0_PLAN.md §5)
build_flags =
    -DSERIAL_RX_BUFFER_SIZE=128
    -DSERIAL_TX_BUFFER_SIZE=128
    -Wall
    -Wextra

; Faz 2a tezgâh derlemesi: YALNIZ yükten ayrık motorlarla, operatör başında. HOME = tezgâh sıfırı; gömülü dar limitler.
[env:uno_bench]
extends = env:uno
build_flags =
    ${env:uno.build_flags}
    -DK9_BENCH=1
lib_deps =
    waspinator/AccelStepper@^1.64
